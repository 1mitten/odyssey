<title>Odyssey Almanac — In-Game Wiki</title>
<style>
:root {
  --bg: #05080c;
  --wash: rgba(8, 14, 8, 0.5);
  --panel-bg: rgba(0, 0, 0, 0.8);
  --panel-rail-bg: rgba(6, 9, 12, 0.85);
  --divider: rgba(255, 255, 255, 0.22);
  --divider-subtle: rgba(255, 255, 255, 0.08);
  --ink: #ffffff;
  --ink-body: rgba(255, 255, 255, 0.82);
  --ink-key: rgba(255, 255, 255, 0.55);
  --ink-sub: rgba(255, 255, 255, 0.5);
  --ink-dim: rgba(255, 255, 255, 0.4);
  --cyan: #7fd0e0;
  --cyan-fill-rail: rgba(127, 208, 224, 0.16);
  --cyan-fill-idx: rgba(127, 208, 224, 0.14);
  --cyan-fill-tab: rgba(127, 208, 224, 0.18);
  --cyan-border: #7fd0e0;
  --f-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Proficiency ramp */
  --ramp-0: #a8453f;
  --ramp-1: #9a7a5a;
  --ramp-2: #c9cdd2;
  --ramp-3: #e0c05a;
  --ramp-4: #f5c518;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100vw; height: 100vh; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 15px; line-height: 1.45;
  user-select: none;
}

/* Background simulated game world */
#world-canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}
.world-wash {
  position: absolute; inset: 0; background: var(--wash);
  pointer-events: none; z-index: 1;
}

/* Full bleed Almanac panel: left:0; right:0; top:0; bottom:70px */
.almanac-panel {
  position: absolute; left: 0; right: 0; top: 0; bottom: 70px;
  background: var(--panel-bg);
  border-bottom: 1px solid var(--divider);
  z-index: 10;
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* Header strip */
.header-strip {
  height: 58px; min-height: 58px; flex: none;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  border-bottom: 1px solid var(--divider);
  background: rgba(0, 0, 0, 0.4);
}
.header-left {
  display: flex; align-items: baseline; gap: 14px;
}
.panel-title {
  font-size: 21px; font-weight: 700; color: #fff; letter-spacing: 0.05em;
}
.count-subtitle {
  font-size: 14px; color: var(--ink-sub); font-weight: 400;
}

/* 360px Search Field */
.search-container {
  position: relative; width: 360px;
}
.search-input-wrap {
  position: relative; width: 360px; height: 34px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.3);
  display: flex; align-items: center; padding: 0 10px; gap: 8px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.search-input-wrap.focused {
  border-color: var(--cyan);
  box-shadow: 0 0 0 1px var(--cyan);
}
.search-glyph {
  width: 16px; height: 16px; stroke: rgba(255, 255, 255, 0.6);
  fill: none; stroke-width: 2; flex: none;
}
.search-input-wrap.focused .search-glyph {
  stroke: var(--cyan);
}
.search-input {
  flex: 1; height: 100%; background: transparent; border: none; outline: none;
  font-family: inherit; font-size: 15px; color: #fff;
}
.search-input::placeholder { color: rgba(255, 255, 255, 0.4); }
.search-hint {
  font-family: var(--f-mono); font-size: 12px; color: var(--ink-sub);
  background: rgba(255, 255, 255, 0.1); padding: 1px 6px; border-radius: 3px;
}
.search-count {
  font-size: 12px; color: var(--cyan); font-weight: 600; white-space: nowrap;
}

.search-results-dropdown {
  position: absolute; top: 40px; left: 0; width: 360px; max-height: 480px;
  background: #090e13; border: 1px solid var(--cyan);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
  overflow-y: auto; z-index: 100; display: none;
}
.search-group-title {
  padding: 8px 12px 4px; font-size: 11px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan);
  background: rgba(127, 208, 224, 0.08); border-bottom: 1px solid rgba(127, 208, 224, 0.15);
}
.search-result-row {
  padding: 8px 12px; display: flex; align-items: center; gap: 10px;
  cursor: pointer; border-bottom: 1px solid var(--divider-subtle);
}
.search-result-row:hover, .search-result-row.selected {
  background: var(--cyan-fill-rail); color: var(--cyan);
}
.search-result-row .res-name { font-size: 15px; color: #fff; flex: 1; }
.search-result-row:hover .res-name { color: var(--cyan); }
.search-result-row .res-sub { font-size: 12px; color: var(--ink-sub); }

.header-right {
  display: flex; align-items: center; gap: 6px;
}
.header-btn {
  width: 32px; height: 32px; border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(0, 0, 0, 0.3); color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.header-btn:hover:not(:disabled) {
  border-color: var(--cyan); color: var(--cyan);
}
.header-btn:disabled {
  opacity: 0.25; cursor: default;
}
.header-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }

/* 3-Column Almanac Body */
.almanac-body {
  flex: 1; display: flex; overflow: hidden; position: relative;
}

/* Section label style */
.section-label {
  font-size: 13px; font-weight: 600; letter-spacing: 0.14em;
  text-transform: uppercase; color: rgba(255, 255, 255, 0.5);
}

/* Column 1 — Category Rail (250px, fixed) */
.category-rail {
  width: 250px; min-width: 250px; max-width: 250px;
  border-right: 1px solid var(--divider);
  padding: 8px; overflow-y: auto; background: var(--panel-rail-bg);
  display: flex; flex-direction: column; gap: 2px;
}
.category-row {
  height: 38px; min-height: 38px; padding: 0 10px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; border: 1px solid transparent; color: #fff;
  transition: background 0.1s, border-color 0.1s;
}
.category-row:hover {
  background: rgba(255, 255, 255, 0.05);
}
.category-row.active {
  background: var(--cyan-fill-rail);
  border-color: var(--cyan);
  color: var(--cyan);
}
.cat-left {
  display: flex; align-items: center; gap: 10px;
}
.cat-icon {
  width: 19px; height: 19px; display: flex; align-items: center; justify-content: center;
}
.cat-icon svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.cat-name {
  font-size: 18px; font-weight: 400;
}
.cat-count {
  font-size: 14px; color: var(--ink-dim);
}
.category-row.active .cat-count {
  color: var(--cyan);
}

/* Column 2 — Index (290px, fixed) */
.index-column {
  width: 290px; min-width: 290px; max-width: 290px;
  border-right: 1px solid var(--divider);
  display: flex; flex-direction: column;
  overflow: hidden; background: rgba(0, 0, 0, 0.4);
}
.index-header {
  height: 34px; min-height: 34px; padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--divider);
  background: rgba(255, 255, 255, 0.02);
}
.index-sort-hint {
  font-size: 13px; font-weight: 600; color: rgba(255, 255, 255, 0.35);
  letter-spacing: 0.08em;
}
.index-list {
  flex: 1; overflow-y: auto;
}
.index-row {
  min-height: 48px; max-height: 52px; height: 50px;
  padding: 0 14px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--divider-subtle);
  cursor: pointer; position: relative;
  white-space: nowrap; overflow: hidden;
}
.index-row:hover {
  background: rgba(255, 255, 255, 0.04);
}
.index-row.active {
  background: var(--cyan-fill-idx);
  box-shadow: inset 3px 0 0 0 var(--cyan);
}
.index-row.active .index-name {
  color: var(--cyan);
}
.index-identity-sq {
  width: 26px; height: 26px; min-width: 26px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.04);
}
.index-identity-sq.swatch {
  border-color: rgba(255, 255, 255, 0.3);
}
.index-identity-sq svg {
  width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8;
}
.index-text {
  flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;
  overflow: hidden;
}
.index-name {
  font-size: 18px; font-weight: 400; color: #fff;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.index-summary {
  font-size: 14px; font-weight: 400; color: var(--ink-sub);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* Column 3 — Detail Pane (fills the rest) */
.detail-pane {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  overflow-y: auto; background: rgba(0, 0, 0, 0.2);
}

/* Band 1 · Identity */
.band-identity {
  padding: 22px 24px;
  border-bottom: 1px solid var(--divider);
  display: flex; gap: 24px; align-items: flex-start;
}
.identity-visual-96 {
  width: 96px; height: 96px; min-width: 96px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(255, 255, 255, 0.25);
  position: relative;
}
.identity-visual-96.icon-mode {
  border-width: 1px;
}
.identity-visual-96 svg {
  width: 56px; height: 56px; stroke: currentColor; fill: none; stroke-width: 1.8;
}
.identity-content {
  flex: 1; min-width: 0;
}
.identity-title-row {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px;
}
.entry-title {
  font-size: 38px; font-weight: 700; color: #fff; line-height: 1.1;
}
.type-chip {
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
  padding: 3px 8px; border: 1px solid rgba(255, 255, 255, 0.25);
  color: rgba(255, 255, 255, 0.7);
}
.nature-chip {
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
  padding: 3px 8px; border-width: 1px; border-style: solid;
}
.entry-definition {
  font-size: 19px; font-weight: 400; line-height: 1.45;
  color: var(--ink-body); max-width: 820px;
  text-wrap: pretty; margin-bottom: 10px;
}
.live-state-line {
  font-size: 15px; font-weight: 400; color: var(--ink-sub);
  display: flex; align-items: center; gap: 8px;
}
.live-state-dot {
  width: 7px; height: 7px; border-radius: 50%; background: #68c05e;
}
.identity-actions {
  display: flex; align-items: center; gap: 8px; flex: none;
}
.btn-primary-action {
  height: 34px; padding: 0 14px;
  border: 1px solid var(--cyan); background: rgba(127, 208, 224, 0.12);
  color: var(--cyan); font-family: inherit; font-size: 14px; font-weight: 600;
  display: flex; align-items: center; gap: 8px; cursor: pointer;
}
.btn-primary-action:hover {
  background: var(--cyan); color: #000;
}
.btn-primary-action svg {
  width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2;
}
.btn-pin {
  width: 34px; height: 34px;
  border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.3);
  color: rgba(255, 255, 255, 0.7); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.btn-pin:hover { border-color: #f5c518; color: #f5c518; }
.btn-pin.pinned { border-color: #f5c518; background: rgba(245, 197, 24, 0.15); color: #f5c518; }
.btn-pin svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
.btn-pin.pinned svg { fill: currentColor; }

/* Mid section: Band 2 Properties (fixed 520px) + Band 3 Body (rest) + Band 4 Related */
.band-mid-columns {
  display: flex; flex: 1; min-height: 0;
}

/* Band 2 · Properties — fixed 520px */
.band-properties {
  width: 520px; min-width: 520px; max-width: 520px;
  padding: 18px 24px; border-right: 1px solid var(--divider);
}
.band-properties .section-label {
  margin-bottom: 12px;
}
.properties-table {
  display: flex; flex-direction: column;
}
.property-row {
  height: 34px; min-height: 34px;
  display: flex; align-items: center;
  border-bottom: 1px solid var(--divider-subtle);
  font-size: 17px;
}
.prop-key {
  width: 150px; min-width: 150px; max-width: 150px;
  color: var(--ink-key); font-weight: 400;
}
.prop-val {
  flex: 1; min-width: 0; color: #fff; font-weight: 400;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.lateral-link {
  color: #fff; text-decoration: none; cursor: pointer;
  border-bottom: 1px dotted rgba(255, 255, 255, 0.4);
}
.lateral-link:hover {
  text-decoration: underline; color: var(--cyan); border-bottom-color: var(--cyan);
}

/* Right column for Band 3 (Body) + Band 4 (Related pinned to bottom) */
.body-and-related-col {
  flex: 1; min-width: 0; padding: 18px 24px;
  display: flex; flex-direction: column;
}

/* Band 3 · Body */
.band-body {
  flex: 1 0 auto;
}
.band-body .section-label {
  margin-bottom: 14px;
}
.body-paragraph {
  font-size: 16px; line-height: 1.55; color: var(--ink-body); max-width: 760px;
  margin-bottom: 18px;
}
.cards-row {
  display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 18px;
}
.card {
  flex: 1; min-width: 240px; padding: 14px 16px;
  background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.12);
}
.card-hdr {
  font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
  margin-bottom: 8px;
}
.card-hdr.best { color: #68c05e; }
.card-hdr.avoid { color: #e06a5c; }
.card-text {
  font-size: 15px; color: var(--ink-body); line-height: 1.45;
}

/* Skill levels ladder (5 x 40px rows) */
.ladder {
  display: flex; flex-direction: column; gap: 4px; max-width: 680px; margin-bottom: 20px;
}
.ladder-row {
  height: 40px; min-height: 40px; padding: 0 14px;
  background: rgba(255, 255, 255, 0.03);
  display: flex; align-items: center; gap: 14px;
  border-left-width: 3px; border-left-style: solid;
}
.ladder-range {
  width: 54px; font-family: var(--f-mono); font-size: 14px; font-weight: 600;
}
.ladder-tier {
  width: 120px; font-size: 15px; font-weight: 600; color: #fff;
}
.ladder-desc {
  flex: 1; font-size: 14px; color: var(--ink-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* Band 4 · Related (pinned with margin-top: auto) */
.band-related {
  margin-top: auto; padding-top: 24px; border-top: 1px solid var(--divider-subtle);
}
.band-related .section-label {
  margin-bottom: 12px;
}
.related-chips {
  display: flex; gap: 10px; flex-wrap: wrap;
}
.related-chip {
  padding: 6px 12px; background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.15); cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  transition: border-color 0.15s, background 0.15s;
}
.related-chip:hover {
  border-color: var(--cyan); background: var(--cyan-fill-rail);
}
.rel-sq {
  width: 20px; height: 20px; min-width: 20px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(255, 255, 255, 0.2);
}
.rel-sq svg {
  width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8;
}
.rel-name {
  font-size: 17px; font-weight: 400; color: #fff;
}
.related-chip:hover .rel-name { color: var(--cyan); }
.rel-reason {
  font-size: 14px; font-weight: 400; color: var(--ink-sub);
}

/* Missing icon dashed square */
.missing-icon {
  width: 100%; height: 100%;
  border: 1.6px dashed rgba(255, 255, 255, 0.4);
}

/* Bottom tab bar: 70px, rgba(0,0,0,.72), 1px top border */
.bottom-tab-bar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 70px;
  background: rgba(0, 0, 0, 0.72); border-top: 1px solid rgba(255, 255, 255, 0.18);
  display: flex; align-items: center; padding: 0 16px; gap: 6px;
  z-index: 20;
}
.tab-btn {
  height: 50px; padding: 0 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.12); color: rgba(255, 255, 255, 0.65);
  cursor: pointer; transition: all 0.1s;
}
.tab-btn:hover {
  background: rgba(255, 255, 255, 0.07); color: #fff; border-color: rgba(255, 255, 255, 0.25);
}
.tab-btn.active {
  background: var(--cyan-fill-tab);
  border: 1px solid var(--cyan);
  color: var(--cyan);
}
.tab-label {
  font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
}
.tab-hotkey {
  font-family: var(--f-mono); font-size: 10.5px; opacity: 0.75;
}

/* Scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.32); }
</style>

<canvas id="world-canvas"></canvas>
<div class="world-wash"></div>

<!-- Full bleed Almanac reference browser -->
<div class="almanac-panel" id="almanac-panel">
  <!-- Header strip -->
  <div class="header-strip">
    <div class="header-left">
      <span class="panel-title">ALMANAC</span>
      <span class="count-subtitle" id="count-subtitle">Loading...</span>
    </div>

    <!-- 360px Search Field -->
    <div class="search-container">
      <div class="search-input-wrap" id="search-wrap">
        <svg class="search-glyph" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" class="search-input" id="search-input" placeholder="Search entries" autocomplete="off" spellcheck="false">
        <span class="search-hint" id="search-hint">/</span>
        <span class="search-count" id="search-count" style="display:none">0 matches</span>
      </div>
      <div class="search-results-dropdown" id="search-dropdown"></div>
    </div>

    <!-- History & Close -->
    <div class="header-right">
      <button class="header-btn" id="btn-back" title="Back (Alt+Left)" disabled>
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button class="header-btn" id="btn-fwd" title="Forward (Alt+Right)" disabled>
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
      <button class="header-btn" id="btn-close" title="Close Almanac (Esc)">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </div>

  <!-- 3-Column Body -->
  <div class="almanac-body">
    <!-- Column 1: Category Rail (250px) -->
    <div class="category-rail" id="category-rail"></div>

    <!-- Column 2: Index (290px) -->
    <div class="index-column" id="index-column">
      <div class="index-header">
        <span class="section-label" id="index-cat-label">INDEX</span>
        <span class="index-sort-hint">A–Z</span>
      </div>
      <div class="index-list" id="index-list"></div>
    </div>

    <!-- Column 3: Detail Pane (fills rest) -->
    <div class="detail-pane" id="detail-pane"></div>
  </div>
</div>

<!-- Bottom tab bar: 70px -->
<div class="bottom-tab-bar" id="bottom-tab-bar">
  <button class="tab-btn"><span class="tab-label">Build</span><span class="tab-hotkey">B</span></button>
  <button class="tab-btn"><span class="tab-label">Work</span><span class="tab-hotkey">F1</span></button>
  <button class="tab-btn"><span class="tab-label">Schedule</span><span class="tab-hotkey">F2</span></button>
  <button class="tab-btn"><span class="tab-label">Research</span><span class="tab-hotkey">F3</span></button>
  <button class="tab-btn"><span class="tab-label">Colonists</span><span class="tab-hotkey">F4</span></button>
  <button class="tab-btn"><span class="tab-label">Animals</span><span class="tab-hotkey">F5</span></button>
  <button class="tab-btn"><span class="tab-label">Wildlife</span><span class="tab-hotkey">F6</span></button>
  <button class="tab-btn"><span class="tab-label">Bills</span><span class="tab-hotkey">F7</span></button>
  <button class="tab-btn"><span class="tab-label">Factions</span><span class="tab-hotkey">F8</span></button>
  <button class="tab-btn active" title="Almanac (F9)"><span class="tab-label">Almanac</span><span class="tab-hotkey">(F9)</span></button>
  <button class="tab-btn" style="margin-left:auto"><span class="tab-label">Menu</span><span class="tab-hotkey">Esc</span></button>
</div>

<script>
/* =========================================================================
   DATABASE: Odyssey Almanac content
   Only items, structures, terrain, and concepts that currently exist in game.
   Every entry has its own explicit SVG line path string { name, colour, path }.
   ========================================================================= */
const ALMANAC_DATA = {
  "categories": [
    {
      "name": "Terrain",
      "iconPath": "M2 18l5-10 6 5 9-9v14H2z",
      "entries": [
        {
          "name": "Grass",
          "summary": "Fast walking meadow cover, pasture base",
          "typeChip": "Terrain",

/* =========================================================================
   APPLICATION CONTROLLER
   - Category -> Index -> Entry navigation
   - Search across all entries with live count
   - Lateral links with history back/forward
   - Dashed square fallback for any missing icon
   ========================================================================= */
class AlmanacApp {
  constructor(data) {
    this.data = data;
    this.categories = data.categories;
    this.currentCatIndex = 0;
    this.currentEntryIndex = 0;
    this.lastSelectedPerCat = {};
    this.history = [];
    this.historyIndex = -1;
    this.pinnedEntries = new Set();
    this.searchQuery = "";

    // Flat list of all entries for search & lateral links
    this.allEntries = [];
    this.categories.forEach((cat, cIdx) => {
      cat.entries.forEach((ent, eIdx) => {
        ent._catName = cat.name;
        ent._catIndex = cIdx;
        ent._entryIndex = eIdx;
        this.allEntries.push(ent);
      });
    });

    this.dom = {
      subtitle: document.getElementById("count-subtitle"),
      searchWrap: document.getElementById("search-wrap"),
      searchInput: document.getElementById("search-input"),
      searchHint: document.getElementById("search-hint"),
      searchCount: document.getElementById("search-count"),
      searchDropdown: document.getElementById("search-dropdown"),
      btnBack: document.getElementById("btn-back"),
      btnFwd: document.getElementById("btn-fwd"),
      btnClose: document.getElementById("btn-close"),
      catRail: document.getElementById("category-rail"),
      indexCatLabel: document.getElementById("index-cat-label"),
      indexList: document.getElementById("index-list"),
      detailPane: document.getElementById("detail-pane"),
      panel: document.getElementById("almanac-panel")
    };

    this.init();
  }

  init() {
    this.dom.subtitle.textContent = `${this.allEntries.length} entries · everything the colony knows`;

    this.renderCategoryRail();
    this.selectCategory(0, 0, false);
    this.bindEvents();
    this.drawWorldCanvas();
  }

  renderSvg(path, colour = "currentColor", strokeWidth = 1.8) {
    if (!path) {
      return `<div class="missing-icon" title="Missing icon: rendered as neutral dashed square"></div>`;
    }
    return `<svg viewBox="0 0 24 24" style="stroke:${colour};stroke-width:${strokeWidth};"><path d="${path}"></path></svg>`;
  }

  renderCategoryRail() {
    this.dom.catRail.innerHTML = "";
    this.categories.forEach((cat, idx) => {
      const row = document.createElement("div");
      row.className = "category-row" + (idx === this.currentCatIndex ? " active" : "");
      row.dataset.catIndex = idx;
      row.innerHTML = `
        <div class="cat-left">
          <div class="cat-icon">${this.renderSvg(cat.iconPath)}</div>
          <span class="cat-name">${cat.name}</span>
        </div>
        <span class="cat-count">${cat.entries.length}</span>
      `;
      row.onclick = () => {
        const savedEntryIdx = this.lastSelectedPerCat[idx] || 0;
        this.selectCategory(idx, savedEntryIdx, true);
      };
      this.dom.catRail.appendChild(row);
    });
  }

  selectCategory(catIdx, entryIdx = 0, recordHist = true) {
    this.currentCatIndex = catIdx;
    this.lastSelectedPerCat[catIdx] = entryIdx;

    // Highlight rail
    const rows = this.dom.catRail.querySelectorAll(".category-row");
    rows.forEach((r, i) => r.classList.toggle("active", i === catIdx));

    const cat = this.categories[catIdx];
    this.dom.indexCatLabel.textContent = cat.name;

    this.renderIndexList(cat, entryIdx);
    this.selectEntry(catIdx, entryIdx, recordHist);
  }

  renderIndexList(cat, activeEntryIdx) {
    this.dom.indexList.innerHTML = "";
    cat.entries.forEach((entry, idx) => {
      const row = document.createElement("div");
      row.className = "index-row" + (idx === activeEntryIdx ? " active" : "");
      row.dataset.entryIndex = idx;

      let idBox = "";
      if (entry.hasColor && entry.color) {
        idBox = `<div class="index-identity-sq swatch" style="background:${entry.color};"></div>`;
      } else {
        const iconCol = entry.icon && entry.icon.colour ? entry.icon.colour : "#7fd0e0";
        idBox = `<div class="index-identity-sq" style="color:${iconCol};border-color:${iconCol}55;background:${iconCol}1f;">
          ${this.renderSvg(entry.icon ? entry.icon.path : "")}
        </div>`;
      }

      row.innerHTML = `
        ${idBox}
        <div class="index-text">
          <div class="index-name">${entry.name}</div>
          ${entry.summary ? `<div class="index-summary">${entry.summary}</div>` : ""}
        </div>
      `;

      row.onclick = () => {
        this.selectEntry(this.currentCatIndex, idx, true);
      };
      this.dom.indexList.appendChild(row);
    });
  }

  selectEntry(catIdx, entryIdx, recordHist = true) {
    this.currentCatIndex = catIdx;
    this.currentEntryIndex = entryIdx;
    this.lastSelectedPerCat[catIdx] = entryIdx;

    // Update index selection UI
    const indexRows = this.dom.indexList.querySelectorAll(".index-row");
    indexRows.forEach((r, i) => r.classList.toggle("active", i === entryIdx));

    const entry = this.categories[catIdx].entries[entryIdx];
    this.renderDetailPane(entry);

    if (recordHist) {
      this.pushHistory(catIdx, entryIdx);
    }
  }

  renderDetailPane(entry) {
    const pane = this.dom.detailPane;
    pane.scrollTop = 0;

    // 1 · Identity visual box (96px square)
    let identityBox = "";
    const primaryColor = entry.hasColor && entry.color ? entry.color : (entry.icon?.colour || "#7fd0e0");
    if (entry.hasColor && entry.color) {
      identityBox = `<div class="identity-visual-96" style="background:${entry.color};box-shadow:inset 0 0 20px rgba(0,0,0,0.35);"></div>`;
    } else {
      identityBox = `<div class="identity-visual-96 icon-mode" style="color:${primaryColor};border-color:${primaryColor}80;background:${primaryColor}1f;">
        ${this.renderSvg(entry.icon?.path, primaryColor, 2)}
      </div>`;
    }

    const isPinned = this.pinnedEntries.has(entry.name);

    // 2 · Properties rows (150px key)
    const propRowsHtml = entry.properties.map(p => {
      // Check if value links to another known entry
      const target = this.findEntryByName(p.value);
      const valHtml = target ?
        `<a class="lateral-link" data-goto="${target.name}">${p.value}</a>` :
        `<span class="prop-val">${p.value}</span>`;

      return `
        <div class="property-row">
          <span class="prop-key">${p.key}</span>
          ${valHtml}
        </div>
      `;
    }).join("");

    // 3 · Body band content
    let bodyContentHtml = "";
    if (entry.body.paragraph) {
      bodyContentHtml += `<p class="body-paragraph">${entry.body.paragraph}</p>`;
    }
    if (entry.body.cards) {
      bodyContentHtml += `<div class="cards-row">` + entry.body.cards.map(c => `
        <div class="card">
          <div class="card-hdr ${c.kind}">${c.title}</div>
          <div class="card-text">${c.text}</div>
        </div>
      `).join("") + `</div>`;
    }
    if (entry.body.ladder) {
      bodyContentHtml += `<div class="ladder">` + entry.body.ladder.map(row => `
        <div class="ladder-row" style="border-left-color:${row.color};">
          <span class="ladder-range" style="color:${row.color};">${row.range}</span>
          <span class="ladder-tier">${row.tier}</span>
          <span class="ladder-desc">${row.desc}</span>
        </div>
      `).join("") + `</div>`;
    }

    // 4 · Related chips (pinned to bottom)
    const relatedChipsHtml = entry.related.map(r => {
      const relEntry = this.findEntryByName(r.name);
      let idThumb = "";
      if (relEntry && relEntry.hasColor && relEntry.color) {
        idThumb = `<div class="rel-sq" style="background:${relEntry.color};"></div>`;
      } else if (relEntry && relEntry.icon) {
        idThumb = `<div class="rel-sq" style="color:${relEntry.icon.colour};">${this.renderSvg(relEntry.icon.path)}</div>`;
      } else {
        idThumb = `<div class="rel-sq">${this.renderSvg("")}</div>`;
      }
      return `
        <div class="related-chip" data-goto="${r.name}">
          ${idThumb}
          <span class="rel-name">${r.name}</span>
          <span class="rel-reason">${r.reason}</span>
        </div>
      `;
    }).join("");

    pane.innerHTML = `
      <!-- Band 1 · Identity -->
      <div class="band-identity">
        ${identityBox}
        <div class="identity-content">
          <div class="identity-title-row">
            <h1 class="entry-title">${entry.name}</h1>
            <span class="type-chip">${entry.typeChip}</span>
            <span class="nature-chip" style="color:${primaryColor};border-color:${primaryColor}66;background:${primaryColor}14;">${entry.natureChip}</span>
          </div>
          <div class="entry-definition">${entry.definition}</div>
          <div class="live-state-line">
            <span class="live-state-dot"></span>
            <span>${entry.liveState}</span>
          </div>
        </div>
        <div class="identity-actions">
          <button class="btn-primary-action" id="btn-primary">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span>${entry.primaryAction}</span>
          </button>
          <button class="btn-pin ${isPinned ? 'pinned' : ''}" id="btn-pin" title="Pin / Favourite">
            <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
          </button>
        </div>
      </div>

      <!-- Mid container: Band 2 Properties (520px fixed) + Right Column for Band 3 & 4 -->
      <div class="band-mid-columns">
        <!-- Band 2 · Properties (fixed 520px) -->
        <div class="band-properties">
          <div class="section-label">PROPERTIES</div>
          <div class="properties-table">
            ${propRowsHtml}
          </div>
        </div>

        <!-- Right Column: Band 3 Body + Band 4 Related -->
        <div class="body-and-related-col">
          <!-- Band 3 · Body -->
          <div class="band-body">
            <div class="section-label">${entry.body.sectionLabel || "DETAILS"}</div>
            ${bodyContentHtml}
          </div>

          <!-- Band 4 · Related (pinned with margin-top: auto) -->
          <div class="band-related">
            <div class="section-label">RELATED</div>
            <div class="related-chips">
              ${relatedChipsHtml}
            </div>
          </div>
        </div>
      </div>
    `;

    // Bind lateral navigation links and pin
    pane.querySelectorAll("[data-goto]").forEach(el => {
      el.onclick = () => {
        const name = el.dataset.goto;
        this.navigateToEntryByName(name);
      };
    });

    const pinBtn = pane.querySelector("#btn-pin");
    if (pinBtn) {
      pinBtn.onclick = () => {
        if (this.pinnedEntries.has(entry.name)) {
          this.pinnedEntries.delete(entry.name);
          pinBtn.classList.remove("pinned");
        } else {
          this.pinnedEntries.add(entry.name);
          pinBtn.classList.add("pinned");
        }
      };
    }
  }

  findEntryByName(name) {
    if (!name) return null;
    const clean = name.trim().toLowerCase();
    return this.allEntries.find(e => e.name.toLowerCase() === clean || e.name.toLowerCase().includes(clean));
  }

  navigateToEntryByName(name) {
    const target = this.findEntryByName(name);
    if (!target) return;
    this.selectCategory(target._catIndex, target._entryIndex, true);
  }

  pushHistory(catIdx, entryIdx) {
    if (this.historyIndex >= 0) {
      const cur = this.history[this.historyIndex];
      if (cur && cur.catIdx === catIdx && cur.entryIdx === entryIdx) return;
    }
    // Truncate any forward history
    this.history = this.history.slice(0, this.historyIndex + 1);
    this.history.push({ catIdx, entryIdx });
    this.historyIndex = this.history.length - 1;
    this.updateHistoryButtons();
  }

  navigateHistory(delta) {
    const nextIdx = this.historyIndex + delta;
    if (nextIdx < 0 || nextIdx >= this.history.length) return;
    this.historyIndex = nextIdx;
    const state = this.history[nextIdx];
    this.selectCategory(state.catIdx, state.entryIdx, false);
    this.updateHistoryButtons();
  }

  updateHistoryButtons() {
    this.dom.btnBack.disabled = this.historyIndex <= 0;
    this.dom.btnFwd.disabled = this.historyIndex >= this.history.length - 1;
  }

  bindEvents() {
    this.dom.btnBack.onclick = () => this.navigateHistory(-1);
    this.dom.btnFwd.onclick = () => this.navigateHistory(1);
    this.dom.btnClose.onclick = () => {
      this.dom.panel.style.display = this.dom.panel.style.display === "none" ? "flex" : "none";
    };

    // Global keyboard hotkeys: / for search, Esc to close/clear
    window.addEventListener("keydown", e => {
      if (e.key === "/" && document.activeElement !== this.dom.searchInput) {
        e.preventDefault();
        this.dom.searchInput.focus();
        this.dom.searchInput.select();
      } else if (e.key === "Escape") {
        if (this.dom.searchDropdown.style.display === "block") {
          this.closeSearch();
        } else {
          // Toggle or close
          this.dom.panel.style.display = this.dom.panel.style.display === "none" ? "flex" : "none";
        }
      } else if (e.key === "F9") {
        e.preventDefault();
        this.dom.panel.style.display = this.dom.panel.style.display === "none" ? "flex" : "none";
      } else if (e.altKey && e.key === "ArrowLeft") {
        e.preventDefault();
        this.navigateHistory(-1);
      } else if (e.altKey && e.key === "ArrowRight") {
        e.preventDefault();
        this.navigateHistory(1);
      }
    });

    // Search field handling
    const input = this.dom.searchInput;
    input.addEventListener("focus", () => {
      this.dom.searchWrap.classList.add("focused");
      this.dom.searchHint.style.display = "none";
      this.dom.searchCount.style.display = "block";
      this.onSearchInput();
    });
    input.addEventListener("blur", () => {
      setTimeout(() => {
        this.dom.searchWrap.classList.remove("focused");
        if (!input.value) {
          this.dom.searchHint.style.display = "block";
          this.dom.searchCount.style.display = "none";
        }
        this.dom.searchDropdown.style.display = "none";
      }, 200);
    });
    input.addEventListener("input", () => this.onSearchInput());
  }

  closeSearch() {
    this.dom.searchInput.blur();
    this.dom.searchDropdown.style.display = "none";
    this.dom.searchWrap.classList.remove("focused");
  }

  onSearchInput() {
    const q = this.dom.searchInput.value.trim().toLowerCase();
    if (!q) {
      this.dom.searchCount.textContent = "0 matches";
      this.dom.searchDropdown.style.display = "none";
      return;
    }

    const matches = this.allEntries.filter(e => {
      return e.name.toLowerCase().includes(q) ||
             (e.summary && e.summary.toLowerCase().includes(q)) ||
             e.definition.toLowerCase().includes(q) ||
             e.properties.some(p => p.key.toLowerCase().includes(q) || p.value.toLowerCase().includes(q));
    });

    this.dom.searchCount.textContent = `${matches.length} match${matches.length === 1 ? '' : 'es'}`;
    this.renderSearchResults(matches);
  }

  renderSearchResults(matches) {
    const drop = this.dom.searchDropdown;
    drop.innerHTML = "";
    if (matches.length === 0) {
      drop.innerHTML = `<div style="padding:14px;color:var(--ink-sub);font-size:14px;">No matching entries found</div>`;
      drop.style.display = "block";
      return;
    }

    // Group by category
    const grouped = {};
    matches.forEach(m => {
      if (!grouped[m._catName]) grouped[m._catName] = [];
      grouped[m._catName].push(m);
    });

    for (const catName in grouped) {
      const gTitle = document.createElement("div");
      gTitle.className = "search-group-title";
      gTitle.textContent = `${catName} (${grouped[catName].length})`;
      drop.appendChild(gTitle);

      grouped[catName].forEach(entry => {
        const row = document.createElement("div");
        row.className = "search-result-row";
        row.innerHTML = `
          <span class="res-name">${entry.name}</span>
          <span class="res-sub">${entry.typeChip}</span>
        `;
        row.onmousedown = (e) => {
          e.preventDefault();
          this.selectCategory(entry._catIndex, entry._entryIndex, true);
          this.closeSearch();
        };
        drop.appendChild(row);
      });
    }

    drop.style.display = "block";
  }

  drawWorldCanvas() {
    const canvas = document.getElementById("world-canvas");
    const ctx = canvas.getContext("2d");
    const resize = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      this.paintWorld(ctx, canvas.width, canvas.height);
    };
    window.addEventListener("resize", resize);
    resize();
  }

  paintWorld(ctx, w, h) {
    ctx.fillStyle = "#0c151c";
    ctx.fillRect(0, 0, w, h);

    // Draw isometric meadow grid lines and buildings in distance
    ctx.strokeStyle = "rgba(45, 85, 60, 0.25)";
    ctx.lineWidth = 1;
    const step = 40;
    for (let y = -h; y < h * 2; y += step) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y + w * 0.5);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(w, y);
      ctx.lineTo(0, y + w * 0.5);
      ctx.stroke();
    }

    // Scattered pine green clusters
    ctx.fillStyle = "rgba(40, 95, 55, 0.4)";
    for (let i = 0; i < 40; i++) {
      const x = (i * 137) % w;
      const y = (i * 241) % h;
      ctx.beginPath();
      ctx.arc(x, y, 18, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// Instantiate on load
window.addEventListener("DOMContentLoaded", () => {
  window.almanacApp = new AlmanacApp(ALMANAC_DATA);
});
</script>
